# ST77922 initialisation sequence — LCDwiki ES3C35P
#
# Merge into a `display:` block of platform mipi_spi:
#
#     <<: !include st77922-init-sequence.yaml
#
# PROVENANCE. This is the table the panel actually runs. The board's factory
# firmware carries it as a 63-entry lcd_init_cmd_t array at app0.bin 0x0b3ec4,
# reached through an st77922_vendor_config_t at 0x0b3e98 = {init_cmds =
# 0x3c1a3ec4, init_cmds_size = 63, use_qspi = 1}; a byte-identical copy sits at
# 0x0eb06c in a different compilation unit. The same table is published openly
# in LCDwiki's own Arduino examples (github.com/ydedox/st77922,
# Example_01_Simple_test), which is the source of the per-entry delays.
#
# THE DECOY. A similar 60-entry table at app0.bin 0x0b43d0 is the upstream
# esp_lcd_st77922 driver's built-in default for a 532x300 panel — its
# CASET/RASET are 00 00 02 13 / 00 00 01 2b. It is loaded only in the branch
# taken when init_cmds is NULL, which on this board it never is. Do not copy it.
#
# THE TRIM. The vendor array has 63 entries; this file carries the first 56,
# ending at RASET. The final seven — 21h INVON, 11h SLPOUT, 29h DISPON, 2Ch
# RAMWR, 3Ah COLMOD, 36h MADCTL, 35h TEON — are omitted because ESPHome appends
# its own tail and hard-rejects a 3Ah inside a user sequence. Express them
# through invert_colors:, color_order: and the LVGL rotation instead.
#
# THE TAIL COMPENSATION. The two entries marked below are not in the vendor
# array. ESPHome prepends SWRESET + 10ms and appends 11h SLPOUT, 10ms, 29h
# DISPON. Sitronix parts want ~120ms after both SWRESET and SLPOUT; 10ms leaves
# the booster unready and the panel lights but renders black. Issuing SLPOUT
# here and settling behind it makes ESPHome's later SLPOUT a no-op on an
# already-woken panel, and its DISPON then arrives well after the panel is
# ready. `delay N` requires a unit and is capped at 255ms.
#
# COLMOD. The vendor writes 0x01 and ESPHome writes 0x55 unconditionally. The
# panel accepts either and renders correct RGB565 from both, so the fact that
# 0x55 cannot be overridden from YAML in quad mode does not matter.

init_sequence:
  - delay 120ms # tail compensation: settle after ESPHome's SWRESET + 10ms
  - [0xF1, 0x00]
  - [0x60, 0x00, 0x00, 0x00]
  - [0x65, 0x80]
  - [0x79, 0x06]
  - [0x7B, 0x00, 0x08, 0x08]
  - [0x80, 0x55, 0x62, 0x2F, 0x17, 0xF0, 0x52, 0x70, 0xD2, 0x52, 0x62, 0xEA]
