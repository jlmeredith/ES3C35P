  # Vendor entry 58 is 11h SLPOUT, paired in the vendor table with a 120ms
  # delay. Issued here to keep that margin; ESPHome's own appended SLPOUT then
  # lands on an already-woken panel. See THE TAIL above — this is margin, not a
  # workaround for a framework defect.
  - [0x11]
  - delay 200ms
